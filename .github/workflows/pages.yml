# GitHub Pages deploy for the Game On V12 tracker.
# In the dedicated `gameon` repo, place this file at: .github/workflows/pages.yml
# Then: repo → Settings → Pages → Source: "GitHub Actions".
# The app is served at https://<user>.github.io/gameon/
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
