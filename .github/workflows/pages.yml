# GitHub Pages deploy for the Game On V12 tracker.
# In the dedicated `gameon` repo, place this file at: .github/workflows/pages.yml
# Then: repo → Settings → Pages → Source: "GitHub Actions".
# The app is served at https://<user>.github.io/gameon/
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Shared with the data updater. Never cancel: a deploy arriving mid-fetch
  # would kill a live gameweek refresh. Deploys take ~20s, so queueing is cheap.
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The app is served from the repo root, so whatever is in the checkout is
      # published. The test suites are not part of the app and have no business
      # on the web: drop them from this throwaway checkout before it is packed.
      # This touches the runner's copy only, never the repository.
      - run: rm -rf tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Same as the data updater: Pages sometimes still holds the previous
      # deployment "in progress" after it was reported done and refuses the
      # next one, and a push lands between two data runs often enough for
      # that to be a red run every few days. Ask again rather than fail.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: echo "deploy refused, asking again in 45s"; sleep 45
      - id: deploy2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "deploy refused twice, asking once more in 90s"; sleep 90
      - id: deploy3
        if: steps.deployment.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
