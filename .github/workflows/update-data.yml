# Auto-updates data.json from the FPL API and redeploys Pages.
# In the dedicated `gameon` repo, place this at: .github/workflows/update-data.yml
# Runs on a schedule + on demand. GitHub's runners reach the FPL API directly,
# so no proxy is needed. Commits data.json AND deploys Pages in one job (a
# GITHUB_TOKEN commit does not trigger the separate Pages workflow, so we
# deploy here directly).
name: Update FPL data
on:
  schedule:
    # One always-on cadence, deliberately dumb. GitHub delays and drops
    # scheduled runs badly at the popular minutes (:00 and :30 especially) —
    # the old three-window schedule missed whole hours on a match night, and
    # its windows also left the Friday 17:30 UTC deadline uncovered. Off-peak
    # minutes, every half hour, all week: the repo is public so the minutes
    # cost nothing, and one line cannot leave a gap around a deadline again.
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch FPL data
        run: node scripts/fetch-data.js
      - name: Verify against FPL's own numbers
        # Never blocks publishing — fresh data beats stale data — but any
        # disagreement with FPL's standings shows up as a warning on the run.
        run: node scripts/verify-data.js
      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data.json)" ]; then
            echo "No data change"
            exit 0
          fi
          # Two clocks poke this workflow, and now and then both land in the
          # same second, so two runs fetch at once and race to push. The
          # loser used to rebase into a conflict on data.json and fail five
          # times over, one red run and one email per collision. Now each
          # attempt starts again from whatever is live and only publishes if
          # what it fetched is fresher than that; otherwise the other run
          # already did the job and this one has nothing to add.
          cp data.json /tmp/fresh.json
          MSG="Update FPL data ($(date -u +%Y-%m-%dT%H:%MZ))"
          stamp() { node -p 'try { JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).generatedAt || "" } catch (e) { "" }' "$1"; }
          MINE=$(stamp /tmp/fresh.json)
          for i in 1 2 3 4 5; do
            git fetch -q --depth=1 origin main
            git reset -q --hard origin/main
            LIVE=$(stamp data.json)
            if [ -n "$LIVE" ] && [ "$MINE" \< "$LIVE" ]; then
              echo "a fresher data.json ($LIVE) is already live; nothing to publish"
              exit 0
            fi
            cp /tmp/fresh.json data.json
            git add data.json
            git commit -q -m "$MSG"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push rejected, starting again from main (attempt $i)"
            sleep $((i * 3))
          done
          echo "could not push data.json after 5 attempts" >&2
          exit 1
      # Same as in pages.yml: the test suites are not part of the served app.
      # This runs after the push above, so it only trims the runner's checkout.
      - run: rm -rf tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      # Pages now and then still calls the previous deployment "in progress"
      # after its own action has reported it done, and refuses a second one
      # made in that window ("due to in progress deployment"); its artifact
      # store also answers 403 for a moment now and then. Either was one red
      # run and one email, for a deploy that would have gone through a minute
      # later. So it is asked again, twice, with a pause each time.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: echo "deploy refused, asking again in 45s"; sleep 45
      - id: deploy2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "deploy refused twice, asking once more in 90s"; sleep 90
      - id: deploy3
        if: steps.deployment.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
