# Auto-updates data.json from the FPL API and redeploys Pages.
# In the dedicated `gameon` repo, place this at: .github/workflows/update-data.yml
# Runs on a schedule + on demand. GitHub's runners reach the FPL API directly,
# so no proxy is needed. Commits data.json AND deploys Pages in one job (a
# GITHUB_TOKEN commit does not trigger the separate Pages workflow, so we
# deploy here directly).
name: Update FPL data
on:
  schedule:
    # One always-on cadence, deliberately dumb. GitHub delays and drops
    # scheduled runs badly at the popular minutes (:00 and :30 especially) —
    # the old three-window schedule missed whole hours on a match night, and
    # its windows also left the Friday 17:30 UTC deadline uncovered. Off-peak
    # minutes, every half hour, all week: the repo is public so the minutes
    # cost nothing, and one line cannot leave a gap around a deadline again.
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch FPL data
        run: node scripts/fetch-data.js
      - name: Verify against FPL's own numbers
        # Never blocks publishing — fresh data beats stale data — but any
        # disagreement with FPL's standings shows up as a warning on the run.
        run: node scripts/verify-data.js
      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data.json)" ]; then
            echo "No data change"
            exit 0
          fi
          git add data.json
          git commit -m "Update FPL data ($(date -u +%Y-%m-%dT%H:%MZ))"
          # main may have moved while we were fetching. Rebase and retry rather
          # than failing the job, which would leave the new data unpublished.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          echo "could not push data.json after 5 attempts" >&2
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
