name: Probe news sources (temporary)
on:
  push:
    branches: [probe-news]
    paths-ignore: ["out/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the new updater, publish nothing
        working-directory: run
        run: |
          start=$(date +%s)
          node scripts/fetch-data.js 2>&1 | grep -E "histories done|live ranks|Wrote data.json|FPL is not answering|Error" || true
          echo "took $(( $(date +%s) - start ))s"
          node -e 'const d=require("./data.json").dataset; const ev=d.bootstrap.events.find(e=>e.is_current); const h=d.history; const me=h[21743][ev.id]; console.log("GW"+ev.id+" you: r="+me.r+" gr="+me.gr+" pc="+me.pc+" points row="+me.p); let n=0,z=0; Object.keys(h).forEach(id=>{const r=h[id][ev.id]; if(r){n++; if(!(r.r>0)) z++;}}); console.log("rows "+n+", without a rank "+z)'
