name: Probe news sources (temporary)
on:
  push:
    branches: [probe-news]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch each source
        run: |
          cat > probe.js <<'JS'
          const UA = "Mozilla/5.0 (compatible; GameOnV12-bot/1.0)";
          const get = async (u, red) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 20000);
            const r = await fetch(u, { headers: { "User-Agent": UA, "Accept": "*/*" }, signal: c.signal, redirect: red || "follow" }); clearTimeout(t);
            return { s: r.status, ct: r.headers.get("content-type"), b: await r.text(), url: r.url, loc: r.headers.get("location") }; };
          (async () => {
            const j = JSON.parse((await get("https://api.premierleague.com/content/premierleague/text/EN?pageSize=6&tagNames=" + encodeURIComponent("label:Fantasy Premier League"))).b);
            console.log("pageInfo " + JSON.stringify(j.pageInfo));
            for (const a of j.content.slice(0, 4)) {
              for (const u of ["https://www.premierleague.com/en/news/" + a.id + "/" + a.titleUrlSegment, "https://www.premierleague.com/news/" + a.id]) {
                try { const r = await get(u); const tt = (r.b.match(/<title>([^<]*)<\/title>/) || [])[1];
                  console.log("LINK " + r.s + " " + u + " -> final " + r.url + " | page title: " + tt + " | has headline: " + (r.b.indexOf(a.title.slice(0, 25)) !== -1)); } catch (e) { console.log("LINK ERROR " + u + " " + e.message); }
              }
              console.log("   item: " + JSON.stringify({ title: a.title, date: a.date, summary: (a.summary || "").slice(0, 160), desc: (a.description || "").slice(0, 160), hot: a.hotlinkUrl, img: a.leadMedia && a.leadMedia.imageUrl, imgOnItem: a.imageUrl }));
            }
            // Google News: the outlet's name, and where an article link lands
            const g = (await get("https://news.google.com/rss/search?q=%22Fantasy+Premier+League%22&hl=en-GB&gl=GB&ceid=GB:en")).b;
            const items = g.split(/<item>/).slice(1);
            console.log("google items " + items.length);
            items.slice(0, 6).forEach((it) => { const src = (it.match(/<source url="([^"]*)">([^<]*)<\/source>/) || []); console.log("G " + ((it.match(/<pubDate>([^<]*)/) || [])[1]) + " | src " + src[2] + " (" + src[1] + ") | " + ((it.match(/<title>([^<]*)/) || [])[1])); });
            const l0 = (items[0].match(/<link>([^<]*)/) || [])[1];
            try { const r = await get(l0, "manual"); console.log("google link -> " + r.s + " loc " + r.loc + " bytes " + r.b.length); } catch (e) { console.log("google link ERROR " + e.message); }
            const f = (await get("https://www.fantasyfootballscout.co.uk/feed/")).b;
            console.log("ffscout items " + f.split(/<item>/).length);
          })();
          JS
          node probe.js
