name: Probe news sources (temporary)
on:
  push:
    branches: [probe-news]
    paths-ignore: ["out/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the news reader and keep its pictures
        run: |
          cat > run.js <<'JS'
          const fs = require("fs");
          (async () => {
            const n = await require("./news.js").newsOf(null, { force: true });
            console.log(JSON.stringify(n.sources));
            const withPic = n.items.filter((it) => it.i);
            console.log("items " + n.items.length + ", with a picture " + withPic.length + " (fpl " + withPic.filter((x) => x.s === "fpl").length + ", ffs " + withPic.filter((x) => x.s === "ffs").length + ")");
            n.items.filter((x) => x.s !== "gn" && !x.i).forEach((x) => console.log("NO PIC " + x.s + " " + x.u));
            fs.mkdirSync("out/pics", { recursive: true });
            const map = {};
            let i = 0, bytes = 0;
            for (const it of withPic) {
              const r = await fetch(it.i, { headers: { Referer: "https://pkpk157-cpu.github.io/" } });
              const b = Buffer.from(await r.arrayBuffer());
              console.log("PIC " + r.status + " " + r.headers.get("content-type") + " " + b.length + " " + it.i);
              if (r.ok) { const f = "out/pics/" + (i++) + ".jpg"; fs.writeFileSync(f, b); map[it.i] = f; bytes += b.length; }
            }
            console.log("total picture bytes " + bytes);
            fs.writeFileSync("out/news.json", JSON.stringify({ news: n, map }, null, 1));
          })();
          JS
          node run.js
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add out && git commit -qm "probe output" && git push -q origin HEAD:probe-news
