name: Probe news sources (temporary)
on:
  push:
    branches: [probe-news]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch each source
        run: |
          cat > probe.js <<'JS'
          const UA = "Mozilla/5.0 (compatible; GameOnV12-bot/1.0)";
          const get = async (u) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 20000);
            const r = await fetch(u, { headers: { "User-Agent": UA, "Accept": "*/*" }, signal: c.signal }); clearTimeout(t);
            return { s: r.status, ct: r.headers.get("content-type"), b: await r.text(), url: r.url }; };
          (async () => {
            const fpl = [], tally = {};
            for (let page = 0; page < 6; page++) {
              try { const r = await get("https://api.premierleague.com/content/premierleague/text/EN?pageSize=100&page=" + page);
                const j = JSON.parse(r.b);
                (j.content || []).forEach((a) => { const tl = (a.tags || []).map((t) => t.label);
                  if (/\bFPL\b|fantasy/i.test(a.title)) { fpl.push(a); tl.forEach((x) => { tally[x] = (tally[x] || 0) + 1; }); } });
                console.log("page " + page + " items " + (j.content || []).length + " oldest " + ((j.content || []).slice(-1)[0] || {}).date);
              } catch (e) { console.log("page " + page + " ERROR " + e.message); }
            }
            console.log("FPL-titled: " + fpl.length);
            console.log("their tags: " + JSON.stringify(Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 40)));
            fpl.slice(0, 25).forEach((a) => console.log(" * " + a.date + " | " + a.title + " | ext " + ((a.tags || []).some((t) => t.label === "External")) + " | hot " + (a.hotlinkUrl || "") + " | canon " + (a.canonicalUrl || "") + " | seg " + (a.titleUrlSegment || "") + " | id " + a.id + " | img " + ((a.leadMedia && a.leadMedia.imageUrl) || a.imageUrl || "")));
            // the tag filter, with the labels these articles actually carry
            const labs = Object.keys(tally).filter((x) => /fpl|fantasy|scout/i.test(x)).slice(0, 6);
            for (const l of labs) {
              try { const r = await get("https://api.premierleague.com/content/premierleague/text/EN?pageSize=8&tagNames=" + encodeURIComponent(l));
                const j = JSON.parse(r.b); console.log("FILTER tagNames=" + l + " total " + (j.pageInfo && j.pageInfo.numEntries) + " :: " + (j.content || []).map((a) => a.date.slice(0, 10) + " " + a.title).join(" || ").slice(0, 900));
              } catch (e) { console.log("FILTER " + l + " ERROR " + e.message); }
            }
            // the Guardian's feed: what it actually carries
            try { const r = await get("https://www.theguardian.com/sport/fantasy-football/rss");
              r.b.split(/<item>/).slice(1, 9).forEach((it) => { const t = (it.match(/<title>([\s\S]*?)<\/title>/) || [])[1]; const d = (it.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1]; const l = (it.match(/<link>([\s\S]*?)<\/link>/) || [])[1]; console.log("GUARDIAN " + d + " | " + t + " | " + l); });
            } catch (e) { console.log("guardian ERROR " + e.message); }
          })();
          JS
          node probe.js
