name: Probe news sources (temporary)
on:
  push:
    branches: [probe-news]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch each source
        run: |
          cat > probe.js <<'JS'
          const UA = "Mozilla/5.0 (compatible; GameOnV12-bot/1.0)";
          const get = async (u) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 20000);
            const r = await fetch(u, { headers: { "User-Agent": UA, "Accept": "*/*" }, signal: c.signal }); clearTimeout(t);
            return { s: r.status, ct: r.headers.get("content-type"), b: await r.text(), url: r.url }; };
          (async () => {
            // 1. which tags do PL articles carry? find the FPL ones
            try {
              const r = await get("https://api.premierleague.com/content/premierleague/text/EN?pageSize=60");
              const j = JSON.parse(r.b); const tally = {};
              j.content.forEach((a) => (a.tags || []).forEach((t) => { const k = (t.label || t.name || JSON.stringify(t)).slice(0, 60); tally[k] = (tally[k] || 0) + 1; }));
              console.log("TAGS over 60 latest: " + JSON.stringify(Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 60)));
              const a0 = j.content[0]; console.log("ITEM KEYS " + Object.keys(a0).join(","));
              console.log("ITEM sample " + JSON.stringify({ title: a0.title, date: a0.date, publishFrom: a0.publishFrom, hotlinkUrl: a0.hotlinkUrl, canonicalUrl: a0.canonicalUrl, url: a0.url, tags: a0.tags, leadMedia: a0.leadMedia && { type: a0.leadMedia.type, imageUrl: a0.leadMedia.imageUrl, onDemandUrl: a0.leadMedia.onDemandUrl }, summary: a0.summary, subtitle: a0.subtitle }).slice(0, 2500));
              const fpl = j.content.filter((a) => /fpl|fantasy/i.test(JSON.stringify(a.tags || []) + " " + a.title));
              console.log("FPL-looking among 60: " + fpl.length + " :: " + fpl.slice(0, 8).map((a) => a.title + " | tags " + JSON.stringify((a.tags || []).map((t) => t.label))).join("\n   "));
            } catch (e) { console.log("tags ERROR " + e.message); }
            // 2. filters to try for FPL-only articles
            const filt = [
              "tagNames=FPL", "tagNames=fpl", "tagNames=Fantasy", "tagNames=FPL%20Scout", "tagNames=The%20Scout",
              "tagExpression=%22FPL%22", "tagExpression=%22Fantasy%20Premier%20League%22", "tags=FPL", "references=FPL"
            ];
            for (const f of filt) {
              try { const r = await get("https://api.premierleague.com/content/premierleague/text/EN?pageSize=5&" + f);
                let line = "status " + r.s; try { const j = JSON.parse(r.b); line += " total " + (j.pageInfo && j.pageInfo.numEntries) + " :: " + (j.content || []).map((a) => a.title).join(" || "); } catch (e) { line += " " + r.b.slice(0, 200); }
                console.log("FILTER " + f + " -> " + line.slice(0, 900));
              } catch (e) { console.log("FILTER " + f + " ERROR " + e.message); }
            }
            // 3. the other two sites' feeds
            const feeds = [
              "https://www.theguardian.com/football/series/fantasy-football-tips/rss",
              "https://www.theguardian.com/football/fantasy-football-tips/rss",
              "https://www.theguardian.com/sport/fantasy-football/rss",
              "https://www.theguardian.com/football/fantasyfootball/rss",
              "https://www.theguardian.com/football/series/fantasy-football/rss",
              "https://www.fantasyfootballpundit.com/rss.xml",
              "https://www.fantasyfootballpundit.com/feed.xml",
              "https://www.fantasyfootballpundit.com/rss",
              "https://www.fantasyfootballpundit.com/sitemap.xml"
            ];
            for (const u of feeds) {
              try { const r = await get(u); const items = r.b.split(/<item[\s>]|<entry[\s>]|<url>/).slice(1);
                console.log("FEED " + u + " -> " + r.s + " " + r.ct + " items " + items.length + " :: " + (items[0] || r.b.slice(0, 200)).slice(0, 400).replace(/\s+/g, " "));
              } catch (e) { console.log("FEED " + u + " ERROR " + e.message); }
            }
            // 4. the Guardian's football page names its fantasy tag
            try { const r = await get("https://www.theguardian.com/football/fantasy-football");
              console.log("GUARDIAN page " + r.s + " final " + r.url + " :: tags " + [...new Set((r.b.match(/theguardian\.com\/[a-z-]+\/[a-z-]*fantasy[a-z-]*/g) || []))].slice(0, 10).join(" , "));
            } catch (e) { console.log("guardian page ERROR " + e.message); }
          })();
          JS
          node probe.js
