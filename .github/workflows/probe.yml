name: Probe news sources (temporary)
on:
  push:
    branches: [probe-news]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch each source
        run: |
          cat > probe.js <<'JS'
          const UA = "Mozilla/5.0 (compatible; GameOnV12-bot/1.0)";
          const get = async (u, asBuf) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 20000);
            const r = await fetch(u, { headers: { "User-Agent": UA, "Accept": "*/*" }, signal: c.signal }); clearTimeout(t);
            const b = asBuf ? Buffer.from(await r.arrayBuffer()) : await r.text();
            return { s: r.status, ct: r.headers.get("content-type"), b, url: r.url, len: asBuf ? b.length : b.length }; };
          (async () => {
            // 1. the Premier League's pictures, and whether they come smaller
            const j = JSON.parse((await get("https://api.premierleague.com/content/premierleague/text/EN?pageSize=4&tagNames=" + encodeURIComponent("label:Fantasy Premier League"))).b);
            const a = j.content[0];
            console.log("LEADMEDIA " + JSON.stringify(a.leadMedia).slice(0, 1500));
            const img = (a.leadMedia && a.leadMedia.imageUrl) || a.imageUrl;
            for (const q of ["", "?width=400", "?width=200&height=120", "?w=400"]) {
              try { const r = await get(img + q, true); console.log("PLIMG " + (q || "(as is)") + " -> " + r.s + " " + r.ct + " " + r.len + " bytes"); } catch (e) { console.log("PLIMG " + q + " ERROR " + e.message); }
            }
            // 2. the Scout's feed: any picture in it?
            const f = (await get("https://www.fantasyfootballscout.co.uk/feed/")).b;
            const it = f.split(/<item>/)[1] || "";
            console.log("FFS media tags: media:content " + /<media:content/.test(f) + ", enclosure " + /<enclosure/.test(f) + ", content:encoded " + /<content:encoded/.test(f) + ", img in item " + /<img/.test(it));
            const link = ((it.match(/<link>([^<]*)/) || [])[1] || "").trim();
            // 3. the Scout's article page: its share picture
            try { const r = await get(link); const og = (r.b.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)/i) || r.b.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image/i) || [])[1];
              console.log("FFS page " + r.s + " og:image " + og);
              if (og) { const i = await get(og, true); console.log("FFS img " + i.s + " " + i.ct + " " + i.len + " bytes"); }
            } catch (e) { console.log("FFS page ERROR " + e.message); }
            // 4. Google News: any picture in the feed?
            const g = (await get("https://news.google.com/rss/search?q=%22Fantasy+Premier+League%22&hl=en-GB&gl=GB&ceid=GB:en")).b;
            console.log("GN media tags: media:content " + /<media:content/.test(g) + ", enclosure " + /<enclosure/.test(g) + ", img " + /&lt;img|<img/.test(g));
          })();
          JS
          node probe.js
