# Runs on every push. Cheap, and it closes the hole that let a file which had
# never once parsed sit in this repository for weeks: worker.js is pasted into
# Cloudflare by hand, so nothing here ever executed it.
name: Sources parse
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    # Pinned for the season: GitHub moves "ubuntu-latest" to a new release
    # from 19 October 2026, and nothing here should change under the app
    # mid-season without being asked to. 24.04 is supported into 2029.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save js-yaml
      - run: node scripts/check-sources.js
