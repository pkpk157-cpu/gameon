# ---------------------------------------------------------------------------
# The league's clock.
#
# The updater used to be poked every ten minutes by a cron trigger on a
# Cloudflare Worker. On 8 September 2026 that trigger stopped firing: the
# dashboard still showed "Every 10 minutes" and a "Next run" time, no logs, no
# errors, and nothing ran for three and a half hours. Free Workers offer no
# execution guarantee for cron, and a clock that can stop without saying so is
# not a clock.
#
# GitHub's own schedule is not a replacement either. This repository asks for
# twice an hour and gets three to six firings a day, sometimes with five-hour
# gaps — which is why the Worker existed in the first place.
#
# So the clock lives here now, in the same place as the work. This job pokes
# the updater every ten minutes for the best part of an hour, then hands over
# to a fresh copy of itself. The chain is what keeps time; everything else is
# a way of restarting it if it ever breaks:
#
#   - GitHub's schedule below restarts it whenever it does fire.
#   - The Cloudflare cron still pokes the updater directly if it recovers.
#   - Only one chain can exist at a time (concurrency, cancel-in-progress), so
#     a restart replaces the old chain rather than doubling the cadence.
#
# It also watches the thing it is responsible for: if data.json has not been
# published for 45 minutes, the step fails, and GitHub emails the repository
# owner. Silence was the whole problem the first time.
#
# The runner spends most of its life asleep. On a public repository Actions
# minutes are free and unlimited, and this is the project publishing its own
# data, but if you would rather not lean on that, the paid Cloudflare plan
# ($5/month) gives the Worker cron a real execution guarantee and this file
# can go.
# ---------------------------------------------------------------------------
name: Heartbeat
on:
  # A backstop, not the clock. GitHub honours these when it feels like it,
  # which is exactly why the chain above does the real work.
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  # One chain, always. A new heartbeat replaces the one it finds running, so a
  # backstop firing mid-chain restarts the loop instead of running two.
  group: heartbeat
  cancel-in-progress: true
jobs:
  tick:
    # Pinned for the season: GitHub moves "ubuntu-latest" to a new release
    # from 19 October 2026, and nothing here should change under the app
    # mid-season without being asked to. 24.04 is supported into 2029.
    runs-on: ubuntu-24.04
    # Up to ten minutes waiting for its slot, then 5 pokes ten minutes apart,
    # then the handover — comfortably inside this.
    timeout-minutes: 70
    steps:
      - name: Check the key that keeps the chain alive
        env:
          PAT: ${{ secrets.CRON_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::CRON_PAT is not set. A workflow cannot start another"
            echo "::error::workflow with the built-in GITHUB_TOKEN — GitHub blocks"
            echo "::error::that to stop runaway loops — so the chain cannot hand"
            echo "::error::over and the clock will stop when this run ends."
            echo "::error::Fix: Settings → Secrets and variables → Actions → New"
            echo "::error::repository secret, named CRON_PAT, holding a token with"
            echo "::error::Actions: read and write on this repository."
            exit 1
          fi

      - name: Poke the updater every ten minutes
        env:
          GH_TOKEN: ${{ secrets.CRON_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # The Cloudflare cron came back, and it pokes at :00, :10, :20 and
          # so on, to the second. This chain used to drift across it, and for
          # the forty minutes at a time that the two coincided every poke was
          # two runs, two publishes and two Pages deploys a minute apart —
          # and the second deploy was refused now and then, one red run and
          # one email a day. So this chain keeps to :05, :15, :25 and so on:
          # with both clocks alive the data moves every five minutes, evenly,
          # and never twice at once; with either one down, every ten.
          now=$(date -u +%s)
          wait=$(( (300 - now % 600 + 600) % 600 ))
          echo "first poke at $(date -u -d "@$((now + wait))" +%H:%M:%SZ), in ${wait}s"
          sleep "$wait"
          # A run that never finishes holds the lock every later update waits
          # on. On 6 October one sat "waiting" for a Pages deployment approval
          # that nobody is asked for (no reviewers, no timer) and blocked every
          # update for eighteen hours: its 30-minute timeout never started,
          # because the job itself never did. So before each poke, any update
          # or deploy run unfinished after 25 minutes is cancelled. A normal
          # run takes under five. Runs older than a week are left alone: GitHub
          # keeps the odd ghost it will not cancel, and it blocks nothing.
          heal() {
            for wf in update-data.yml pages.yml; do
              ids=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=50" --jq '.workflow_runs[]
                | select(.status != "completed")
                | select((now - (.created_at | fromdateiso8601)) > 1500 and (now - (.created_at | fromdateiso8601)) < 604800)
                | .id' 2>/dev/null) || { echo "::warning::could not list $wf runs"; continue; }
              for id in $ids; do
                echo "::warning::$wf run $id has been stuck over 25 minutes, cancelling it so updates can continue"
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 \
                  || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 \
                  || echo "::warning::could not cancel run $id"
              done
            done
          }
          for i in 1 2 3 4 5; do
            heal
            echo "--- poke $i of 5 at $(date -u +%H:%M:%SZ)"
            # A failed poke costs one cycle; the next one is ten minutes away
            # and the loop keeps its own time, so it is never fatal on its own.
            gh workflow run update-data.yml --repo "$REPO" --ref main \
              || echo "::warning::poke $i failed"
            if [ "$i" != "5" ]; then sleep 600; fi
          done

      - name: Check the data actually got published
        env:
          GH_TOKEN: ${{ secrets.CRON_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # Give the last poke room to finish before judging it.
          sleep 90
          LAST=$(gh api "repos/$REPO/commits?path=data.json&per_page=1" \
                   --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
          if [ -z "$LAST" ]; then
            echo "::warning::could not read the last data.json commit"
            exit 0
          fi
          AGE=$(( $(date -u +%s) - $(date -u -d "$LAST" +%s) ))
          echo "data.json last published $LAST — ${AGE}s ago"
          if [ "$AGE" -gt 2700 ]; then
            # If the newest finished update kept the live data because FPL
            # was down, there is nothing to fix here: the app shows the last
            # data and says how old it is, and the next run catches up.
            # the newest update that actually ran: a duplicate cancelled in
            # the queue has no steps to read
            LASTRUN=$(gh api "repos/$REPO/actions/workflows/update-data.yml/runs?status=completed&per_page=15" \
                        --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].id // empty' 2>/dev/null || echo "")
            FPLDOWN=""
            if [ -n "$LASTRUN" ]; then
              FPLDOWN=$(gh api "repos/$REPO/actions/runs/$LASTRUN/jobs" \
                --jq '[.jobs[].steps[] | select(.name == "FPL unavailable, the last data stays live" and .conclusion == "success")] | length' 2>/dev/null || echo "")
            fi
            if [ "$FPLDOWN" = "1" ]; then
              echo "::warning::data.json is $((AGE / 60)) minutes old because FPL is unavailable; the last data stays live."
              exit 0
            fi
            echo "::error::data.json has not been published for $((AGE / 60)) minutes."
            echo "::error::The clock is running, so the updater itself is failing —"
            echo "::error::check the most recent 'Update FPL data' run."
            exit 1
          fi

      - name: Hand over to the next heartbeat
        # Runs even if the watchdog above failed: a broken updater must not
        # also stop the clock, or one problem quietly becomes two.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CRON_PAT }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do
            if gh workflow run heartbeat.yml --repo "$REPO" --ref main; then
              echo "handed over"
              exit 0
            fi
            echo "handover attempt $i failed, retrying"
            sleep $((i * 5))
          done
          echo "::error::could not hand over — the chain has stopped. The"
          echo "::error::scheduled backstop will restart it, eventually."
          exit 1
