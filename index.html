<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale stops iOS Safari's automatic zoom when a small input takes
     focus (which left pages sitting zoomed-in afterwards); user pinch zoom is
     unaffected — Safari ignores the cap for real gestures. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>FPL Game On V12 — League Tracker</title>
<meta name="description" content="Live tracker for the Game On V12 private FPL league — Classic, Monthly, Last Manager Standing, UCL (H2H) and the Pyramid Battle." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#37003c" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#37003c" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Game On V12" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<script>
  /* Apply the saved theme before paint to avoid a flash. */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("go12.theme"));
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    /* straight after the reload a new version makes, the opening screen was
       on a moment ago: it comes back without its fade-in */
    try { if (sessionStorage.getItem("go12.swreload")) document.documentElement.classList.add("swreload"); } catch (e) {}
    /* opened from the home screen, on Android or an iPhone: the opening
       screen picks up from the launch screen the phone draws for itself
       (see #splash .sptile) */
    try {
      var installed = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      if (installed && !document.documentElement.classList.contains("swreload")) document.documentElement.classList.add("applaunch");
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The opening screen, for two seconds exactly: the crest on the app's
       purple, with the line under it, gone two seconds after the app was
       opened however quick or slow the first standings are. -->
  <div id="splash" aria-hidden="true">
    <div class="spbands"></div>
    <div class="spglow"></div>
    <img class="spcrest" src="logo-crest.webp" alt="" width="555" height="555" decoding="async" fetchpriority="high" />
    <div class="splashtxt">The home of the<br>FPL addicts</div>
    <!-- opened from the home screen, the phone has just shown its own
         launch screen: the icon in a circle on this purple. The opening
         screen starts as exactly that, then becomes itself. -->
    <img class="sptile" src="launch-tile.webp" alt="" width="512" height="512" decoding="sync" fetchpriority="high" />
  </div>
  <header class="topbar">
    <button class="backbtn" id="barBack" aria-label="Back" style="display:none"></button>
    <button class="menubtn" id="barMenu" title="Sections" aria-label="Sections"></button>
    <div class="barwrap">
      <h1 class="bartitle" id="barTitle">Classic League</h1>
      <div class="barline">
        <div class="barsub" id="barSub"></div>
        <!-- On another manager's page: compare with yours, or keep an eye on
             him. They sit with his name rather than in the page under it. -->
        <div class="barpills" id="barPills" style="display:none">
          <button type="button" class="barpill" id="cmpMe">Compare</button>
          <button type="button" class="barpill" id="rvToggle" aria-pressed="false">Rival</button>
          <span class="barpill you" id="youPill" style="display:none">This is you</span>
        </div>
      </div>
    </div>
    <button class="infobtn" id="barInfo" title="Rules" aria-label="Competition rules" style="display:none"></button>
    <div class="spacer"></div>
    <button class="profilebtn" id="barYou" title="You and the league" aria-label="You and the league"></button>
  </header>

  <main class="wrap">
    <section class="view" data-view="classic"></section>
    <section class="view" data-view="monthly"></section>
    <section class="view" data-view="lms"></section>
    <section class="view" data-view="pyramid"></section>
    <section class="view" data-view="h2h"></section>
    <section class="view" data-view="rules"></section>
    <section class="view" data-view="settings"></section>
    <section class="view" data-view="profile"></section>
    <section class="view" data-view="compare"></section>
    <section class="view" data-view="stats"></section>
    <section class="view" data-view="prices"></section>
    <section class="view" data-view="chips"></section>
    <section class="view" data-view="pl"></section>
    <section class="view" data-view="fpl"></section>
    <section class="view" data-view="winnings"></section>
    <section class="view" data-view="gwstatus"></section>
    <section class="view" data-view="vol"></section>
    <section class="view" data-view="player"></section>
  </main>

  <nav class="navbar" id="navbar"></nav>

  <div id="toast"></div>
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <div class="hd"><h3 id="modalTitle">—</h3><span class="x" id="modalClose">×</span></div>
      <div class="bd" id="modalBody"></div>
    </div>
  </div>
  <div class="modal-back drawer" id="menuBack">
    <div class="modal"><div class="bd" id="menuBody"></div></div>
  </div>
  <div class="modal-back drawer right" id="youBack">
    <div class="modal"><div class="bd" id="youBody"></div></div>
  </div>

  <script src="config.js"></script>
  <script src="scripts/bonus.js"></script>
  <script src="api.js"></script>
  <script src="data.js"></script>
  <script src="usage.js"></script>
  <script src="compute.js"></script>
  <script src="theo.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      /* The app opens from the release the worker keeps on the phone. A newer
         release is fetched in the background and takes over the next time
         the app is opened, never by reloading it in front of the reader. A
         page left open across a release (back from the background hours
         later) is brought up to date the next time it comes to the front. */
      var hadWorker = !!navigator.serviceWorker.controller, newer = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadWorker) newer = true; });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || !newer) return;
        newer = false;
        // the opening screen shows without its hold and its fade-in
        try { sessionStorage.setItem("go12.swreload", "1"); } catch (e) {}
        location.reload();
      });
      // Registered once the app has drawn and settled, so on a first open
      // the worker's own download never competes with the league's data.
      window.addEventListener("load", function () {
        setTimeout(function () {
          navigator.serviceWorker.register("sw.js").then(function (reg) {
            var check = function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); };
            check();
            document.addEventListener("visibilitychange", check);
          }).catch(function () {});
        }, window.__SW_DELAY != null ? window.__SW_DELAY : 4000);
      });
    }
  </script>
  <!-- GoatCounter, hands-off: no automatic counting (the app is hash-routed,
       so app.js reports each tab change itself), async so it can never hold
       the app up, and count.js failing to load simply means nothing counts.
       Not loaded at all on localhost, so development and tests stay silent;
       ?gcdev=1 forces it there for testing the wiring itself. -->
  <script>
    (function () {
      var local = /^(localhost|127\.|\[?::1)/.test(location.hostname);
      if (local && location.search.indexOf("gcdev") === -1) return;
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://gameon.goatcounter.com/count");
      s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
