<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FPL Game On V12 — League Tracker</title>
<meta name="description" content="Live tracker for the Game On V12 private FPL league — Classic, Monthly, Last Manager Standing, UCL (H2H) and the Pyramid Battle." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#37003c" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#37003c" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Game On V12" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<script>
  /* Apply the saved theme before paint to avoid a flash. */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("go12.theme"));
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="backbtn" id="barBack" aria-label="Back" style="display:none"></button>
    <button class="menubtn" id="barMenu" title="Sections" aria-label="Sections"></button>
    <div class="barwrap">
      <h1 class="bartitle" id="barTitle">Classic League</h1>
      <div class="barsub" id="barSub"></div>
    </div>
    <button class="infobtn" id="barInfo" title="Rules" aria-label="Competition rules" style="display:none"></button>
    <div class="spacer"></div>
    <button class="profilebtn" id="btnSync" title="Refresh data" aria-label="Refresh data"></button>
  </header>

  <main class="wrap">
    <section class="view" data-view="classic"></section>
    <section class="view" data-view="monthly"></section>
    <section class="view" data-view="lms"></section>
    <section class="view" data-view="pyramid"></section>
    <section class="view" data-view="h2h"></section>
    <section class="view" data-view="rules"></section>
    <section class="view" data-view="settings"></section>
    <section class="view" data-view="profile"></section>
    <section class="view" data-view="compare"></section>
    <section class="view" data-view="stats"></section>
    <section class="view" data-view="prices"></section>
  </main>

  <nav class="navbar" id="navbar"></nav>

  <div id="toast"></div>
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <div class="hd"><h3 id="modalTitle">—</h3><span class="x" id="modalClose">×</span></div>
      <div class="bd" id="modalBody"></div>
    </div>
  </div>
  <div class="modal-back drawer" id="menuBack">
    <div class="modal"><div class="bd" id="menuBody"></div></div>
  </div>

  <script src="config.js"></script>
  <script src="scripts/bonus.js"></script>
  <script src="api.js"></script>
  <script src="data.js"></script>
  <script src="compute.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      /* A device that already has a worker gets reloaded once when a newer one
         takes over, so a deploy reaches everyone without a hard refresh. */
      var hadWorker = !!navigator.serviceWorker.controller, reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!hadWorker || reloading) return;
        reloading = true;
        location.reload();
      });
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          var check = function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); };
          check();
          document.addEventListener("visibilitychange", check);
        }).catch(function () {});
      });
    }
  </script>
  <!-- GoatCounter, hands-off: no automatic counting (the app is hash-routed,
       so app.js reports each tab change itself), async so it can never hold
       the app up, and count.js failing to load simply means nothing counts.
       Not loaded at all on localhost, so development and tests stay silent;
       ?gcdev=1 forces it there for testing the wiring itself. -->
  <script>
    (function () {
      var local = /^(localhost|127\.|\[?::1)/.test(location.hostname);
      if (local && location.search.indexOf("gcdev") === -1) return;
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://gameon.goatcounter.com/count");
      s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
