<script>
  /* Apply the saved theme before paint to avoid a flash. */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("go12.theme"));
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    /* straight after the reload a new version makes, the opening screen was
       on a moment ago: it comes back without its fade-in */
    try { if (sessionStorage.getItem("go12.swreload")) document.documentElement.classList.add("swreload"); } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- The opening screen, for a second at least: the crest on the app's
       purple, with the line under it, then it fades out of the way once the
       first standings are drawn. -->
  <div id="splash" aria-hidden="true">
    <div class="spglow"></div>
    <img src="logo-crest.webp" alt="" width="555" height="555" decoding="async" fetchpriority="high" />
    <div class="splashtxt">The home of the<br>FPL addicts</div>
  </div>
  <header class="topbar">
    <button class="backbtn" id="barBack" aria-label="Back" style="display:none"></button>
    <button class="menubtn" id="barMenu" title="Sections" aria-label="Sections"></button>
    <div class="barwrap">
      <h1 class="bartitle" id="barTitle">Classic League</h1>
      <div class="barline">
        <div class="barsub" id="barSub"></div>
        <!-- On another manager's page: compare with yours, or keep an eye on
             him. They sit with his name rather than in the page under it. -->
        <div class="barpills" id="barPills" style="display:none">
          <button type="button" class="barpill" id="cmpMe">Compare</button>
          <button type="button" class="barpill" id="rvToggle" aria-pressed="false">Rival</button>
          <span class="barpill you" id="youPill" style="display:none">This is you</span>
        </div>
      </div>
    </div>
    <button class="infobtn" id="barInfo" title="Rules" aria-label="Competition rules" style="display:none"></button>
    <div class="spacer"></div>
    <button class="profilebtn" id="barYou" title="You and the league" aria-label="You and the league"></button>
  </header>

  <main class="wrap">
    <section class="view" data-view="classic"></section>
    <section class="view" data-view="monthly"></section>
    <section class="view" data-view="lms"></section>
    <section class="view" data-view="pyramid"></section>
    <section class="view" data-view="h2h"></section>
    <section class="view" data-view="rules"></section>
    <section class="view" data-view="settings"></section>
    <section class="view" data-view="profile"></section>
    <section class="view" data-view="compare"></section>
    <section class="view" data-view="stats"></section>
    <section class="view" data-view="prices"></section>
    <section class="view" data-view="chips"></section>
    <section class="view" data-view="pl"></section>
    <section class="view" data-view="fpl"></section>
    <section class="view" data-view="winnings"></section>
    <section class="view" data-view="gwstatus"></section>
    <section class="view" data-view="vol"></section>
    <section class="view" data-view="player"></section>
  </main>

  <nav class="navbar" id="navbar"></nav>

  <div id="toast"></div>
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <div class="hd"><h3 id="modalTitle">—</h3><span class="x" id="modalClose">×</span></div>
      <div class="bd" id="modalBody"></div>
    </div>
  </div>
  <div class="modal-back drawer" id="menuBack">
    <div class="modal"><div class="bd" id="menuBody"></div></div>
  </div>
  <div class="modal-back drawer right" id="youBack">

  <script src="config.js"></script>
  <script src="scripts/bonus.js"></script>
  <script src="api.js"></script>
  <script src="data.js"></script>
  <script src="usage.js"></script>
  <script src="compute.js"></script>
  <script src="theo.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      /* A device that already has a worker gets reloaded once when a newer one
         takes over, so a deploy reaches everyone without a hard refresh. */
      var hadWorker = !!navigator.serviceWorker.controller, reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!hadWorker || reloading) return;
        reloading = true;
        // the opening screen was just seen; the reload shows it without the
        // second's hold and the fade, so it does not play twice
        try { sessionStorage.setItem("go12.swreload", "1"); } catch (e) {}
        location.reload();
      });
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          var check = function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); };
          check();
          document.addEventListener("visibilitychange", check);
        }).catch(function () {});
      });
    }
  </script>
  <!-- GoatCounter, hands-off: no automatic counting (the app is hash-routed,
       so app.js reports each tab change itself), async so it can never hold
       the app up, and count.js failing to load simply means nothing counts.
       Not loaded at all on localhost, so development and tests stay silent;
       ?gcdev=1 forces it there for testing the wiring itself. -->
  <script>
    (function () {
      var local = /^(localhost|127\.|\[?::1)/.test(location.hostname);
      if (local && location.search.indexOf("gcdev") === -1) return;
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://gameon.goatcounter.com/count");
      s.setAttribute("data-goatcounter-settings", '{"no_onload": true}');
      document.body.appendChild(s);
    })();
  </script>
</body>
